<!DOCTYPE html>
<html>
  <head>
    <title>AR Sergi</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      video { display: none; }
    </style>
  </head>
  <body>
    <!-- Video Kütüphanesi -->
    <video id="v1" src="video1.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v2" src="video2.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v3" src="video3.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v4" src="video4.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v5" src="video5.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v6" src="video6.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v7" src="video7.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v8" src="video8.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v9" src="video9.mp4" loop playsinline crossorigin="anonymous"></video>
    <video id="v10" src="video10.mp4" loop playsinline crossorigin="anonymous"></video>

    <!-- AR Sahnesi -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true;" embedded
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      
      <a-assets>
        <video id="vid1" src="video1.mp4" preload="auto"></video>
        <video id="vid2" src="video2.mp4" preload="auto"></video>
        <video id="vid3" src="video3.mp4" preload="auto"></video>
        <video id="vid4" src="video4.mp4" preload="auto"></video>
        <video id="vid5" src="video5.mp4" preload="auto"></video>
        <video id="vid6" src="video6.mp4" preload="auto"></video>
        <video id="vid7" src="video7.mp4" preload="auto"></video>
        <video id="vid8" src="video8.mp4" preload="auto"></video>
        <video id="vid9" src="video9.mp4" preload="auto"></video>
        <video id="vid10" src="video10.mp4" preload="auto"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Her target için ayrı a-video -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#vid1" width="1" height="0.5625" position="0 0 0" autoplay="false"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-video src="#vid2" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-video src="#vid3" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3">
        <a-video src="#vid4" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 4">
        <a-video src="#vid5" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 5">
        <a-video src="#vid6" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 6">
        <a-video src="#vid7" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 7">
        <a-video src="#vid8" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 8">
        <a-video src="#vid9" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 9">
        <a-video src="#vid10" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const scene = document.querySelector("a-scene");
        const videos = [];

        for (let i = 1; i <= 10; i++) {
          const marker = scene.querySelector(`[mindar-image-target="targetIndex: ${i - 1}"]`);
          const video = document.querySelector(`#vid${i}`);
          videos.push(video);

          marker.addEventListener("targetFound", () => video.play());
          marker.addEventListener("targetLost", () => video.pause());
        }
      });
    </script>
  </body>
</html>
